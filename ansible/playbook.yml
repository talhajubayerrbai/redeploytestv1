---
- name: Configure EC2 and deploy FastAPI application
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/app
    app_user: ubuntu
    venv_dir: /opt/app/.venv
    python_bin: /usr/bin/python3.11
    gunicorn_bin: /opt/app/.venv/bin/gunicorn
    service_name: fastapi-app
    project_root: "{{ lookup('env', 'GITHUB_WORKSPACE') }}"

  tasks:

    # -------------------------------------------------------------------------
    # System packages
    # -------------------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - python3.11
          - python3.11-venv
          - python3.11-dev
          - python3-pip
          - nginx
          - git
          - curl
          - build-essential
        state: present

    # -------------------------------------------------------------------------
    # Application directory
    # -------------------------------------------------------------------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    # -------------------------------------------------------------------------
    # Copy application source from checked-out repo
    # -------------------------------------------------------------------------
    - name: Synchronise application source to EC2
      synchronize:
        src: "{{ project_root }}/"
        dest: "{{ app_dir }}/"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.github"
          - "--exclude=terraform"
          - "--exclude=ansible"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=.env"
      become: false

    - name: Fix ownership of application files
      file:
        path: "{{ app_dir }}"
        state: directory
        recurse: yes
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    # -------------------------------------------------------------------------
    # Python virtual environment
    # -------------------------------------------------------------------------
    - name: Create Python 3.11 virtual environment
      command: "{{ python_bin }} -m venv {{ venv_dir }}"
      args:
        creates: "{{ venv_dir }}/bin/activate"
      become_user: "{{ app_user }}"

    - name: Upgrade pip inside venv
      command: "{{ venv_dir }}/bin/pip install --upgrade pip"
      become_user: "{{ app_user }}"

    - name: Install Python dependencies from requirements.txt
      command: "{{ venv_dir }}/bin/pip install -r {{ app_dir }}/requirements.txt"
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      when: lookup('fileglob', project_root + '/requirements.txt') != []

    - name: Install fallback dependencies when no requirements.txt present
      command: >
        {{ venv_dir }}/bin/pip install
        fastapi uvicorn[standard] gunicorn python-multipart
        aiofiles httpx pydantic
      become_user: "{{ app_user }}"
      when: lookup('fileglob', project_root + '/requirements.txt') == []

    # -------------------------------------------------------------------------
    # .env file (rendered via shell to tolerate empty values)
    # -------------------------------------------------------------------------
    - name: Write .env file
      shell: |
        cat > {{ app_dir }}/.env << 'ENVEOF'
        APP_ENV=production
        PORT=8000
        HOST=0.0.0.0
        ENVEOF
      args:
        executable: /bin/bash

    - name: Fix .env ownership
      file:
        path: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0640"

    # -------------------------------------------------------------------------
    # public/index.html - copy from repo if it exists
    # -------------------------------------------------------------------------
    - name: Check if public/index.html exists in repo
      stat:
        path: "{{ project_root }}/public/index.html"
      register: index_html_stat
      delegate_to: localhost
      become: false

    - name: Ensure public directory exists on remote
      file:
        path: "{{ app_dir }}/public"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      when: index_html_stat.stat.exists

    - name: Copy public/index.html from repo to remote
      copy:
        src: "{{ project_root }}/public/index.html"
        dest: "{{ app_dir }}/public/index.html"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      when: index_html_stat.stat.exists

    # -------------------------------------------------------------------------
    # systemd service
    # -------------------------------------------------------------------------
    - name: Write systemd service unit
      shell: |
        cat > /etc/systemd/system/{{ service_name }}.service << 'SVCEOF'
        [Unit]
        Description=FastAPI application (gunicorn + uvicorn)
        After=network.target

        [Service]
        Type=simple
        User={{ app_user }}
        Group={{ app_user }}
        WorkingDirectory={{ app_dir }}
        EnvironmentFile={{ app_dir }}/.env
        ExecStart={{ gunicorn_bin }} app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000
        Restart=always
        RestartSec=5
        StandardOutput=journal
        StandardError=journal
        SyslogIdentifier={{ service_name }}

        [Install]
        WantedBy=multi-user.target
        SVCEOF
      args:
        executable: /bin/bash

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start application service
      systemd:
        name: "{{ service_name }}"
        enabled: yes
        state: restarted

    # -------------------------------------------------------------------------
    # nginx configuration
    # -------------------------------------------------------------------------
    - name: Write nginx site configuration
      shell: |
        cat > /etc/nginx/sites-available/{{ service_name }} << 'NGINXEOF'
        server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name _;

            access_log /var/log/nginx/{{ service_name }}_access.log;
            error_log  /var/log/nginx/{{ service_name }}_error.log;

            location / {
                proxy_pass         http://127.0.0.1:8000;
                proxy_set_header   Host              $host;
                proxy_set_header   X-Real-IP         $remote_addr;
                proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
                proxy_connect_timeout 10s;
            }
        }
        NGINXEOF
      args:
        executable: /bin/bash

    - name: Enable site - symlink into sites-enabled
      file:
        src: "/etc/nginx/sites-available/{{ service_name }}"
        dest: "/etc/nginx/sites-enabled/{{ service_name }}"
        state: link

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test nginx configuration
      command: nginx -t
      changed_when: false

    - name: Enable and restart nginx
      systemd:
        name: nginx
        enabled: yes
        state: restarted

    # -------------------------------------------------------------------------
    # Smoke test from the EC2 host itself
    # -------------------------------------------------------------------------
    - name: Wait for gunicorn to be ready on port 8000
      wait_for:
        host: 127.0.0.1
        port: 8000
        delay: 3
        timeout: 60

    - name: Local smoke test - /health via nginx (port 80)
      command: curl -sf http://127.0.0.1/health
      register: smoke_result
      retries: 6
      delay: 5
      until: smoke_result.rc == 0
      changed_when: false