name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      TF_DIR: terraform
      ANSIBLE_DIR: ansible

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Configure AWS credentials
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # -----------------------------------------------------------------------
      # 3. Generate SSH key pair (ephemeral, for this run only)
      # -----------------------------------------------------------------------
      - name: Generate SSH key pair
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/deploy_key -N ""
          chmod 600 ~/.ssh/deploy_key
          echo "SSH_PUBLIC_KEY=$(cat ~/.ssh/deploy_key.pub)" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 4. Terraform - Setup
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # 5. Terraform Init
      # -----------------------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      # -----------------------------------------------------------------------
      # 6. Terraform Plan
      # -----------------------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="public_key=${SSH_PUBLIC_KEY}" \
            -out=tfplan

      # -----------------------------------------------------------------------
      # 7. Terraform Apply
      # -----------------------------------------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve tfplan

      # -----------------------------------------------------------------------
      # 8. Capture EC2 public IP
      # -----------------------------------------------------------------------
      - name: Get EC2 public IP
        working-directory: ${{ env.TF_DIR }}
        run: |
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=${SERVER_IP}" >> $GITHUB_ENV
          echo "Deploying to: ${SERVER_IP}"

      # -----------------------------------------------------------------------
      # 9. Wait for SSH to become available
      # -----------------------------------------------------------------------
      - name: Wait for SSH
        run: |
          echo "Waiting for SSH on ${SERVER_IP}..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=5 \
                   -o BatchMode=yes \
                   -i ~/.ssh/deploy_key \
                   ubuntu@${SERVER_IP} "echo ok" 2>/dev/null; then
              echo "SSH is available."
              exit 0
            fi
            echo "Attempt $i/30 - retrying in 10s..."
            sleep 10
          done
          echo "ERROR: SSH did not become available within 5 minutes."
          exit 1

      # -----------------------------------------------------------------------
      # 10. Install Ansible
      # -----------------------------------------------------------------------
      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible

      # -----------------------------------------------------------------------
      # 11. Run Ansible playbook
      # -----------------------------------------------------------------------
      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i "${SERVER_IP}," \
            --private-key ~/.ssh/deploy_key \
            --user ubuntu \
            ${{ env.ANSIBLE_DIR }}/playbook.yml \
            --extra-vars "app_dir=/opt/app project_root=${{ github.workspace }}"

      # -----------------------------------------------------------------------
      # 12. Health-check verification (MUST succeed or the job fails)
      # -----------------------------------------------------------------------
      - name: Verify deployment health
        run: |
          echo "Checking health endpoint at http://${SERVER_IP}/health ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${SERVER_IP}/health" || echo "000")
            echo "Attempt $i: HTTP ${STATUS}"
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 400 ]; then
              echo "Health check PASSED (HTTP ${STATUS})"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Health check FAILED - app did not return 2xx/3xx after 2 minutes."
          exit 1

      # -----------------------------------------------------------------------
      # 13. Terraform Destroy (cleanup on failure - manual teardown workflow)
      # -----------------------------------------------------------------------
      # NOTE: A separate workflow_dispatch-only destroy job is the recommended
      # pattern. The destroy step below is intentionally NOT triggered
      # automatically so that a passing deploy is not immediately torn down.
      # Run it manually via a separate workflow if needed.

  destroy:
    name: Destroy Infrastructure (manual)
    runs-on: ubuntu-latest
    if: ${{ false }}   # Never triggered automatically; invoke via separate dispatch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Destroy
        working-directory: terraform
        run: |-
          terraform destroy -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="public_key=dummy"
